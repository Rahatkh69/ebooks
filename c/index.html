<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <meta content="Chat app created by @rahatkh69. Connect and chat with friends!" name="description">
    <meta content="@rahatkh69" name="author">
    <meta content="Chat App - @rahatkh69" property="og:title">
    <meta content="A simple chat app to stay connected." property="og:description">
    <meta content="a.png" property="og:image">
    <meta content="https://yourwebsite.com" property="og:url">
    <meta content="Chat App - @rahatkh69" name="twitter:title">
    <meta content="A simple chat app to stay connected." name="twitter:description">
    <meta content="a.png" name="twitter:image">
    <meta content="summary_large_image" name="twitter:card">
    <meta content="#000000" name="theme-color">
    <link href="a.png" rel="icon" type="image/x-icon">
    <title>@rahatkh69 Chat App</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"
        crossorigin="anonymous"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --surface-color: #121212;
            --primary-text-color: #ffffff;
            --secondary-text-color: #b3b3b3;
            --accent-color: #ffffff;
            --border-color: #272727;
            --hover-color: #1a1a1a;
            --selected-color: #333333;
            --link-color: #90b8f8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text-color);
            position: relative;
            margin: 0;
            padding: 0;
        }

        * {
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        #userMenu {
            position: absolute;
            top: 10px;
            right: 20px;
            cursor: pointer;
            z-index: 100;
        }

        #userIcon {
            margin-top: 1.5em;
            font-size: 20px;
            transition: .2s all ease-in-out;
            color: var(--accent-color);
        }

        #userIcon:hover {
            color: #ff231c;
        }

        #userIcon:hover::after {
            content: "Logout";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 5px;
            border-radius: 5px;
            font-size: 8px;
            white-space: nowrap;
        }

        #chatContainer {
            width: 70%;
            margin: 0 auto;
            max-width: 1200px;
        }

        #chatBox {
            height: 70vh;
            overflow-y: auto;
            background: var(--bg-color);
            padding: 0 10px;
        }

        .message {
            padding: 12px;
            margin-bottom: 10px;
            border-top: 1px solid var(--border-color);
            max-width: 100%;
            position: relative;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .message:hover {
            background-color: var(--hover-color);
        }

        .message.selected-message {
            background-color: var(--selected-color);
            border-color: #555;
        }

        .message:last-child {
            border-bottom: 1px solid var(--border-color);
        }

        .username {
            font-weight: 700;
            color: var(--primary-text-color);
            display: block;
            margin-bottom: 4px;
        }

        .message-content a {
            color: var(--link-color);
            text-decoration: none;
        }

        .message-content a:hover {
            text-decoration: underline;
        }

        .link-thumbnail {
            width: 16px;
            height: 16px;
            margin-right: 5px;
            vertical-align: middle;
        }

        .message img {
            max-width: 100%;
            max-height: 250px;
            cursor: pointer;
            border-radius: 5px;
        }

        .message-actions {
            position: absolute;
            top: 8px;
            right: 12px;
            display: none;
            gap: 10px;
            background-color: #3f3f3f;
            padding: 5px;
            border-radius: 5px;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .message-actions i {
            cursor: pointer;
            color: #ccc;
            font-size: 14px;
        }

        .message-actions i:hover {
            color: #fff;
        }

        /* Colorful Login Screen */
        #loginScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }

        #loginScreen h2 {
            font-size: 36px;
            font-weight: bolder;
            color: #000;
            margin-bottom: 20px;
        }

        #loginScreen h1 {
            font-size: 16px;
            font-weight: 700;
            color: #000;
            margin-bottom: 20px;
        }

        #loginScreen h1 a {
            text-decoration: none;
            font-weight: 750;
            color: #0004ff;
        }


        #usernameInput {
            width: 100%;
            max-width: 300px;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
            margin-bottom: 5px;
            font-weight: 700;
            outline: 0;
            transition: border-color .3s ease;
        }

        #usernameInput:focus {
            border-color: #0004ff;
        }

        #getLogin {
            width: 100%;
            font-weight: 700;
            max-width: 300px;
            border: 2px solid #001aff;
            padding: 12px;
            font-size: 16px;
            background-color: #001aff;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color .3s ease;
        }

        #getLogin:hover {
            background-color: #fff;
            color: #001aff;
        }

        #getLogin:active {
            background-color: #00408d;
        }

        /* Themed Chat Bar */
        #chatBar {
            display: flex;
            align-items: center;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 20px;
        }

        #textInput {
            flex: 1;
            margin: 5px;
            padding: 8px;
            outline: 0;
            width: 100%;
            border: none;
            background: transparent;
            color: var(--primary-text-color);
            font-size: 16px;
            resize: none;
            font-family: 'Poppins', sans-serif;
            line-height: 1.4;
        }

        #imageInput,
        #fileInput {
            display: none;
        }

        #imageIcon,
        #fileIcon,
        #sendBtn {
            font-size: 24px;
            cursor: pointer;
            color: var(--accent-color);
            margin: 0 10px;
        }

        #sendBtn {
            font-size: 30px;
        }

        #sendBtn:hover,
        #imageIcon:hover,
        #fileIcon:hover {
            color: #ccc;
        }

        .file-message-container {
            display: flex;
            align-items: center;
            background-color: var(--surface-color);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .file-icon {
            font-size: 2em;
            margin-right: 15px;
            color: var(--accent-color);
        }

        .file-details {
            flex-grow: 1;
        }

        .file-details span {
            display: block;
        }

        .file-details .file-size {
            font-size: 0.8em;
            color: var(--secondary-text-color);
        }

        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .8);
            text-align: center;
        }

        #modalImage {
            max-width: 90%;
            max-height: 90vh;
            margin-top: 5vh;
        }

        #closeModal {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
        }

        #downloadBtn {
            display: inline-block;
            color: #fff;
            margin-top: 10px;
            text-decoration: none;
            background-color: #333;
            padding: 8px 15px;
            border-radius: 5px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background-color: #1b1c1d;
        }

        ::-webkit-scrollbar-thumb {
            background: #333537;
            border-radius: 15px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div id="userMenu">
        <i class="fa-solid fa-user" id="userIcon" title="Logout" onclick="reloadPage()"></i>
    </div>
    <div id="loginScreen">
        <h2>What's up fam <i class="fa-solid fa-fire" style="color:#ff4d00"></i></h2>
        <input id="usernameInput" autocomplete="off" placeholder="Username?" maxlength="15">
        <button onclick="login()" id="getLogin">Login</button>
        <h1>Made By Rahat Khan</h1>
    </div>
    <div id="chatContainer" style="display:none;padding:20px">
        <h2>Chat App</h2>
        <div id="chatBox"></div>
        <div id="chatBar">
            <label for="imageInput"><i class="fa-solid fa-image" id="imageIcon" title="Send Image"></i></label>
            <input id="imageInput" accept="image/*" onchange="sendImageMessage()" type="file">

            <label for="fileInput"><i class="fa-solid fa-paperclip" id="fileIcon" title="Send File"></i></label>
            <input id="fileInput" onchange="sendFileMessage()" type="file">

            <textarea id="textInput" placeholder="Type here..." rows="1"></textarea>
            <i class="fa-solid fa-2xl fa-circle-arrow-up" id="sendBtn" title="Send Message"
                onclick="sendTextMessage()"></i>
        </div>
    </div>
    <div id="imageModal">
        <span id="closeModal">&times;</span>
        <img id="modalImage" alt="Enlarged view">
        <a download id="downloadBtn">Download</a>
    </div>

    <script>
        // Non-module utility functions
        function reloadPage() { location.reload(); }
    </script>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage.js" type="module"></script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
import { getDatabase, ref, set, push, onChildAdded } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";
import { getStorage, ref as storageRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-storage.js";

// IMPORTANT: For a production app, secure your Firebase config and use Security Rules & App Check.
const firebaseConfig = {
    apiKey: "AIzaSyDQRkRwwdoWdQtumKSqciwJUSFILayasCU",
    authDomain: "rahatkh6969.firebaseapp.com",
    databaseURL: "https://rahatkh6969-default-rtdb.firebaseio.com",
    projectId: "rahatkh6969",
    storageBucket: "rahatkh6969.appspot.com",
    messagingSenderId: "70507241803",
    appId: "1:70507241803:web:02a5c126fe66e27be7c8ce",
    measurementId: "G-B9BPK5V0LH"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const storage = getStorage(app);
let username = "";
let currentMessageIndex = -1; // This variable will no longer be strictly needed for line-by-line scrolling but kept as it might be used elsewhere.

function saveMessage(path, data) {
    push(ref(database, path), data);
}

function escapeHTML(str) {
    const p = document.createElement("p");
    p.textContent = str;
    return p.innerHTML;
}

function parseLinks(text) {
    const urlRegex = /(https?:\/\/[^\s]+)/g;
    return text.replace(urlRegex, (url) => {
        const favicon = `<img src="https://s2.googleusercontent.com/s2/favicons?domain=${url}" alt="favicon" class="link-thumbnail">`;
        return `<a href="${url}" target="_blank" rel="noopener noreferrer">${favicon} ${url}</a>`;
    });
}

function formatFileSize(bytes) {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function displayMessages() {
    const chatBox = document.getElementById("chatBox");
    onChildAdded(ref(database, "chats"), (snapshot) => {
        const data = snapshot.val();
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message");

        const userSpan = document.createElement("span");
        userSpan.classList.add("username");
        userSpan.textContent = data.username;

        const contentSpan = document.createElement("div");
        contentSpan.classList.add("message-content");

        let contentToCopy = "";

        if (data.type === "text") {
            contentSpan.innerHTML = parseLinks(escapeHTML(data.content).replace(/\n/g, '<br>'));
            contentToCopy = data.content;
        } else if (data.type === "image") {
            let img = document.createElement("img");
            img.src = data.content;
            img.onclick = () => openImageModal(data.content);
            contentSpan.appendChild(img);
            contentToCopy = data.content;
        } else if (data.type === "file") {
            const file = data.fileInfo;
            contentSpan.innerHTML = `
                <a href="${file.downloadURL}" target="_blank" download="${file.name}">
                    <div class="file-message-container">
                        <i class="fa-solid fa-file-arrow-down file-icon"></i>
                        <div class="file-details">
                            <span class="file-name">${escapeHTML(file.name)}</span>
                            <span class="file-size">${formatFileSize(file.size)}</span>
                        </div>
                    </div>
                </a>
            `;
            contentToCopy = file.downloadURL;
        }

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'message-actions';
        const copyBtn = document.createElement('i');
        copyBtn.className = 'fa-solid fa-copy';
        copyBtn.title = 'Copy';
        copyBtn.onclick = (e) => {
            e.stopPropagation();
            navigator.clipboard.writeText(contentToCopy).then(() => {
                copyBtn.className = 'fa-solid fa-check';
                setTimeout(() => { copyBtn.className = 'fa-solid fa-copy'; }, 1500);
            }).catch(err => console.error('Failed to copy: ', err));
        };

        actionsDiv.appendChild(copyBtn);
        messageDiv.append(userSpan, contentSpan, actionsDiv);
        chatBox.appendChild(messageDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
        currentMessageIndex = -1;
    });
}

window.login = function () {
    const usernameInput = document.getElementById("usernameInput").value.trim();
    if (usernameInput) {
        username = usernameInput;
        set(ref(database, "users/" + username), { username: username, loggedIn: true });
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("chatContainer").style.display = "block";
        displayMessages();
    } else { alert("Please enter a valid username."); }
};

window.sendTextMessage = function () {
    const textInput = document.getElementById("textInput");
    const content = textInput.value.trim();
    if (content) {
        saveMessage("chats", { type: "text", content: content, username: username, timestamp: new Date().toISOString() });
        textInput.value = "";
        textInput.style.height = 'auto';
    }
};

window.sendImageMessage = function () {
    const file = document.getElementById("imageInput").files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => saveMessage("chats", { type: "image", content: e.target.result, username: username, timestamp: new Date().toISOString() });
        reader.readAsDataURL(file);
    }
};

window.sendFileMessage = function () {
    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];
    if (!file) return;

    const fileIcon = document.getElementById('fileIcon');
    fileIcon.className = 'fa-solid fa-spinner fa-spin'; // Show loading indicator

    const fileRef = storageRef(storage, `chat-files/${Date.now()}-${file.name}`);

    uploadBytes(fileRef, file).then(snapshot => {
        getDownloadURL(snapshot.ref).then(url => {
            const message = {
                type: "file",
                username: username,
                timestamp: new Date().toISOString(),
                fileInfo: { name: file.name, size: file.size, type: file.type, downloadURL: url }
            };
            saveMessage("chats", message);
            fileIcon.className = 'fa-solid fa-paperclip'; // Reset icon
            fileInput.value = ""; // Clear input
        });
    }).catch(error => {
        console.error("Upload failed:", error);
        alert("Sorry, the file upload failed.");
        fileIcon.className = 'fa-solid fa-paperclip'; // Reset icon on error
    });
};

window.openImageModal = function (src) {
    document.getElementById("imageModal").style.display = "block";
    document.getElementById("modalImage").src = src;
    const downloadBtn = document.getElementById("downloadBtn");
    downloadBtn.href = src;
    downloadBtn.setAttribute("download", `image_${new Date().getTime()}.png`);
};

document.getElementById("closeModal").onclick = () => { document.getElementById("imageModal").style.display = "none"; };

// --- Event Listeners ---
document.getElementById("usernameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
const textInput = document.getElementById("textInput");
textInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendTextMessage(); } });
textInput.addEventListener('input', () => { textInput.style.height = 'auto'; textInput.style.height = (textInput.scrollHeight) + 'px'; });

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") document.getElementById("imageModal").style.display = "none";
    const chatBox = document.getElementById("chatBox");

    // Only handle arrow keys if the text input is not focused
    if (document.activeElement !== textInput && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
        e.preventDefault(); // Prevent default browser scrolling

        const scrollAmount = 20; // Adjust this value to control scroll speed (in pixels)

        if (e.key === "ArrowUp") {
            chatBox.scrollBy({ top: -scrollAmount, behavior: 'smooth' });
        } else if (e.key === "ArrowDown") {
            chatBox.scrollBy({ top: scrollAmount, behavior: 'smooth' });
        }
    }
});
</script>
</body>

</html>
