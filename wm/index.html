<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dictionary</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Hind+Siliguri:wght@300;400;500;600;700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <script defer>
    document.addEventListener("DOMContentLoaded", () => {
      const preloader = document.getElementById("preloader");
      const preloaderCount = document.getElementById("preloader-count");
      const preloaderStatus = document.getElementById("preloader-status");
      const appContainer = document.getElementById("app-container");
      const lessonContainer = document.getElementById("lesson-container");
      const wordDetailsModal = document.getElementById("word-details-modal");
      const closeModalBtn = document.getElementById("close-modal");
      const booklinesToggleBtn = document.getElementById("booklines-toggle");
      const wordCounter = document.getElementById("word-counter");
      const modalWord = document.getElementById("modal-word");
      const modalBangla = document.getElementById("modal-bangla");
      const modalDefinition = document.getElementById("modal-definition");
      const modalExample = document.getElementById("modal-example");
      const modalBooklines = document.getElementById("modal-booklines");
      const newBtn = document.getElementById("new-btn");
      const readBtn = document.getElementById("read-btn");
      const nextWordBtn = document.getElementById("next-word-btn");
      const clearAllDataBtn = document.getElementById("clear-all-data-btn");
      const confirmModal = document.getElementById("confirm-modal");
      const confirmYesBtn = document.getElementById("confirm-yes-btn");
      const confirmNoBtn = document.getElementById("confirm-no-btn");
      const frequencyDisplay = document.getElementById("frequency-display");
      const messageModal = document.getElementById("message-modal");
      const messageText = document.getElementById("message-text");
      const messageOkBtn = document.getElementById("message-ok-btn");
      const globalSearch = document.getElementById("global-search");
      const searchClear = document.getElementById("search-clear");
      const searchResults = document.getElementById("search-results");
      const paginationContainer = document.getElementById("pagination-container");
      const paginationContainerBottom = document.getElementById("pagination-container-bottom");
      const prevPageBtn = document.getElementById("prev-page");
      const nextPageBtn = document.getElementById("next-page");
      const prevPageBtnBottom = document.getElementById("prev-page-bottom");
      const nextPageBtnBottom = document.getElementById("next-page-bottom");
      const pageInfo = document.getElementById("page-info");
      const pageInfoBottom = document.getElementById("page-info-bottom");

      let allWords = [];
      let allBooklines = [];
      let currentLesson = 0;
      let currentWordIndex = 0;
      let currentPage = 1;
      const WORDS_PER_LESSON = 100;
      const LESSONS_PER_PAGE = 15;

      const wordProgressCache = new Map();
      const lessonDataCache = new Map();
      const lessonListeners = new Map();

      let currentLessonWords = [];
      let isFrequencyMode = true;
      let showBooklines = true; // NEW: Booklines visibility state
      let startY = 0;
      let startX = 0;
      let isSwiping = false;
      let isFirebaseReady = false;
      let firstUnreadWordId = 1;

      const appId = typeof window.__app_id !== "undefined" ? window.__app_id : "default-app-id";
      const firebaseLib = window.firebase;
      let database = null;

      const log = (m) => {};
      const logErr = (m, e) => console.error(m, e || "");

      let dbInstance = null;
      
      // Initialize IndexedDB
      const initIndexedDB = () => {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open('DictionaryDB', 1);
          
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            dbInstance = request.result;
            resolve(dbInstance);
          };
          
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            
            // Create object stores if they don't exist
            if (!db.objectStoreNames.contains('dictionary_data')) {
              db.createObjectStore('dictionary_data', { keyPath: 'key' });
            }
          };
        });
      };

      const saveDataToIndexedDB = async (key, data) => {
        try {
          if (!dbInstance) await initIndexedDB();
          
          const transaction = dbInstance.transaction(['dictionary_data'], 'readwrite');
          const store = transaction.objectStore('dictionary_data');
          
          await new Promise((resolve, reject) => {
            const request = store.put({ key: key, data: data, timestamp: Date.now() });
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
          });
          
          return true;
        } catch (e) {
          console.error('Failed to save to IndexedDB:', e);
          return false;
        }
      };

      const loadDataFromIndexedDB = async (key) => {
        try {
          if (!dbInstance) await initIndexedDB();
          
          const transaction = dbInstance.transaction(['dictionary_data'], 'readonly');
          const store = transaction.objectStore('dictionary_data');
          
          return new Promise((resolve, reject) => {
            const request = store.get(key);
            request.onsuccess = () => {
              const result = request.result;
              resolve(result ? result.data : null);
            };
            request.onerror = () => reject(request.error);
          });
        } catch (e) {
          console.error('Failed to load from IndexedDB:', e);
          return null;
        }
      };

      const updateProgressBar = (current, total, message) => {
        const percentage = Math.round((current / total) * 100);
        if (message.includes('cache') || message.includes('loaded')) {
          preloaderCount.textContent = allWords ? allWords.length : 0;
        } else {
          preloaderCount.textContent = percentage;
        }
        setStatus(message);
      };

      const showMessageModal = (message, autoCloseMs = 0) => {
        messageText.textContent = message;
        messageModal.classList.remove("hidden");
        updateScrollLock();
        if (autoCloseMs > 0) {
          setTimeout(() => {
            messageModal.classList.add("hidden");
            updateScrollLock();
          }, autoCloseMs);
        }
      };

      const setStatus = (text, isError = false) => {
        preloaderStatus.textContent = text;
        preloaderStatus.className = isError ? "preloader-status error" : "preloader-status";
      };

      const updateScrollLock = () => {
        const anyOpen = !wordDetailsModal.classList.contains("hidden") ||
                        !confirmModal.classList.contains("hidden") ||
                        !messageModal.classList.contains("hidden");
        document.body.classList.toggle("modal-open", anyOpen);
      };

      const processWordsInChunks = async (words, booklines) => {
        const CHUNK_SIZE = 100; // Reduced chunk size for smoother updates
        const processedWords = [];
        
        for (let i = 0; i < words.length; i += CHUNK_SIZE) {
          const chunk = words.slice(i, i + CHUNK_SIZE);
          const processedChunk = chunk.map(word => {
            const matchingBookline = booklines.find(b => b.id === word.id);
            return {
              ...word,
              booklines: matchingBookline ? matchingBookline.booklines : [
                "No booklines available for this word.",
                "Please check the booklines data file.",
                "Default placeholder text."
              ]
            };
          });
          
          processedWords.push(...processedChunk);
          
          // Update progress more frequently for smoother animation
          const progress = Math.min(i + CHUNK_SIZE, words.length);
          updateProgressBar(progress, words.length, `Processing words... ${progress}/${words.length}`);
          
          // Yield control to prevent browser freezing
          await new Promise(resolve => setTimeout(resolve, 1));
        }
        
        return processedWords;
      };

      const loadDatabasesWithProgress = async () => {
        try {
          setStatus("Checking cached data...");
          
          const cachedWords = await loadDataFromIndexedDB('dictionary_words');
          const cachedBooklines = await loadDataFromIndexedDB('dictionary_booklines');
          const cacheVersion = await loadDataFromIndexedDB('dictionary_cache_version');
          const currentVersion = '1.0';
          
          if (cachedWords && cachedBooklines && cacheVersion === currentVersion && 
              Array.isArray(cachedWords) && Array.isArray(cachedBooklines) && 
              cachedWords.length > 0 && cachedBooklines.length > 0) {
            setStatus("Loading from cache...");
            allWords = cachedWords;
            allBooklines = cachedBooklines;
            
            allWords = await processWordsInChunks(allWords, allBooklines);
            
            // Trigger smooth final animation after cache loading
            setStatus("Loading...");
            animateCounterSmooth(2000); // 2 second smooth animation
            return true;
          }

          setStatus("Downloading database files...");
          
          let loadedCount = 0;
          const totalFiles = 2;

          updateProgressBar(loadedCount, totalFiles, "Downloading words database...");
          const wordsResponse = await fetch('./data.json');
          if (!wordsResponse.ok) throw new Error('Failed to load words data');
          allWords = await wordsResponse.json();
          loadedCount++;
          updateProgressBar(loadedCount, totalFiles, "Words database loaded");

          updateProgressBar(loadedCount, totalFiles, "Downloading booklines database...");
          const booklinesResponse = await fetch('./booklines/b.json');
          if (!booklinesResponse.ok) throw new Error('Failed to load booklines data');
          allBooklines = await booklinesResponse.json();
          loadedCount++;
          updateProgressBar(loadedCount, totalFiles, "Booklines database loaded");

          setStatus("Processing word data...");
          allWords = await processWordsInChunks(allWords, allBooklines);

          setStatus("Caching data to IndexedDB...");
          const wordsCached = await saveDataToIndexedDB('dictionary_words', allWords);
          const booklinesCached = await saveDataToIndexedDB('dictionary_booklines', allBooklines);
          const versionCached = await saveDataToIndexedDB('dictionary_cache_version', currentVersion);
          
          // Trigger smooth final animation after all processing
          setStatus("Loading...");
          animateCounterSmooth(2000); // 2 second smooth animation
          return true;
        } catch (error) {
          setStatus("Failed to load database files", true);
          console.error('Database loading error:', error);
          setTimeout(() => {
            hideLoadingScreen();
          }, 2000);
          return false;
        }
      };

      const hideLoadingScreen = () => {
        preloader.style.opacity = "0";
        setTimeout(() => {
          preloader.classList.add("hidden");
          appContainer.classList.remove("hidden");
        }, 300);
      };

      const toggleBooklines = () => {
        showBooklines = !showBooklines;
        updateBooklinesToggle();
        updateModalContent();
      };

      const updateBooklinesToggle = () => {
        const icon = booklinesToggleBtn.querySelector('i');
        const text = booklinesToggleBtn.querySelector('.toggle-text');
        
        if (showBooklines) {
          icon.className = 'fas fa-eye';
          text.textContent = 'Hide Context';
          booklinesToggleBtn.classList.add('active');
        } else {
          icon.className = 'fas fa-eye-slash';
          text.textContent = 'Show Context';
          booklinesToggleBtn.classList.remove('active');
        }
      };

      const highlightWordInBooklines = (text, targetWord) => {
        if (!targetWord || !text) return text;
        const regex = new RegExp(`\\b(${targetWord.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})\\b`, "gi");
        return text.replace(regex, '<span style="background: rgba(0, 255, 136, 0.3); color: #00ff88; padding: 1px 3px; border-radius: 3px; font-weight: 600;">$1</span>');
      };

      const firebaseConfig = {
        apiKey: "AIzaSyAimhK1una261vXi7jZ2TVrzf9-OmU-0XE",
        authDomain: "dictionary-43809.firebaseapp.com",
        databaseURL: "https://dictionary-43809-default-rtdb.asia-southeast1.firebasedatabase.app/",
        projectId: "dictionary-43809",
        storageBucket: "dictionary-43809.firebasestorage.app",
        messagingSenderId: "455079496140",
        appId: "1:455079496140:web:ad629c9de32348dad67569",
        measurementId: "G-EN2L4364DD",
      };

      const initializeFirebase = async () => {
        setStatus("Connecting...");
        try {
          if (!firebaseLib.apps.length) firebaseLib.initializeApp(firebaseConfig);
          database = firebaseLib.database();
          await database.ref(".info/serverTimeOffset").once("value");
          isFirebaseReady = true;
          setStatus("Connected");
        } catch (e) {
          isFirebaseReady = false;
          database = null;
          setStatus("Offline", true);
          logErr("Firebase init error", e);
        }
      };

      const getLessonNumber = (wordId) => Math.ceil(wordId / WORDS_PER_LESSON);
      const getWordStatus = (wordId) => wordProgressCache.get(wordId) || "ur";

      const setWordStatus = (wordId, status) => {
        if (status === "ur") {
          wordProgressCache.delete(wordId);
        } else {
          wordProgressCache.set(wordId, status);
        }
        const lessonNum = getLessonNumber(wordId);
        if (!lessonDataCache.has(lessonNum)) {
          lessonDataCache.set(lessonNum, { read: new Set(), new: new Set() });
        }
        const lessonData = lessonDataCache.get(lessonNum);
        lessonData.read.delete(wordId);
        lessonData.new.delete(wordId);
        if (status === "r") lessonData.read.add(wordId);
        if (status === "n") lessonData.new.add(wordId);
      };

      const findFirstUnreadWord = () => {
        for (let wordId = 1; wordId <= allWords.length; wordId++) {
          if (!wordProgressCache.has(wordId)) return wordId;
        }
        return null;
      };

      const updateContinueSystem = () => {
        firstUnreadWordId = findFirstUnreadWord();
      };

      const setupLessonListener = (lessonNum) => {
        if (lessonListeners.has(lessonNum)) return;
        const lessonRef = database.ref(`apps/${appId}/L${lessonNum}`);
        const listener = lessonRef.on("value", (snapshot) => {
          const lessonData = snapshot.val();
          const startWordId = (lessonNum - 1) * WORDS_PER_LESSON + 1;
          const endWordId = Math.min(lessonNum * WORDS_PER_LESSON, allWords.length);
          for (let wordId = startWordId; wordId <= endWordId; wordId++) setWordStatus(wordId, "ur");
          if (lessonData) {
            if (lessonData.r) Object.keys(lessonData.r).forEach((id) => setWordStatus(parseInt(id), "r"));
            if (lessonData.n) Object.keys(lessonData.n).forEach((id) => setWordStatus(parseInt(id), "n"));
          }
          updateContinueSystem();
          updateLessonTiles();
          if (!wordDetailsModal.classList.contains("hidden")) updateModalContent();
        });
        lessonListeners.set(lessonNum, { ref: lessonRef, listener });
      };

      const loadLessonData = async (lessonNum) => {
        if (!database || !isFirebaseReady) return;
        try {
          const lessonRef = database.ref(`apps/${appId}/L${lessonNum}`);
          const snapshot = await lessonRef.once("value");
          const lessonData = snapshot.val();
          if (lessonData) {
            if (lessonData.r) Object.keys(lessonData.r).forEach((id) => setWordStatus(parseInt(id), "r"));
            if (lessonData.n) Object.keys(lessonData.n).forEach((id) => setWordStatus(parseInt(id), "n"));
            setupLessonListener(lessonNum);
          }
        } catch (e) {
          logErr("Lesson load error", e);
        }
      };

      const loadAllProgressData = async () => {
        if (!database || !isFirebaseReady) return;
        try {
          const appsRef = database.ref(`apps/${appId}`);
          const snapshot = await appsRef.once("value");
          const appData = snapshot.val();
          if (appData) {
            const totalLessons = Math.ceil(allWords.length / WORDS_PER_LESSON);
            for (let lessonNum = 1; lessonNum <= totalLessons; lessonNum++) {
              if (appData[`L${lessonNum}`]) await loadLessonData(lessonNum);
            }
          }
          updateContinueSystem();
        } catch (e) {
          logErr("Progress load error", e);
        }
      };

      const saveWordProgress = async (wordId, status) => {
        if (!database || !isFirebaseReady) return;
        const lessonNum = getLessonNumber(wordId);
        const updates = {};
        updates[`apps/${appId}/L${lessonNum}/r/${wordId}`] = null;
        updates[`apps/${appId}/L${lessonNum}/n/${wordId}`] = null;
        if (status === "r") updates[`apps/${appId}/L${lessonNum}/r/${wordId}`] = true;
        if (status === "n") updates[`apps/${appId}/L${lessonNum}/n/${wordId}`] = true;
        await database.ref().update(updates);
        if (!lessonListeners.has(lessonNum)) setupLessonListener(lessonNum);
      };

      const progressQueue = [];
      let queueProcessing = false;

      const enqueueProgress = (wordId, status) => {
        progressQueue.push({ wordId, status, attempts: 0 });
        processQueue();
      };

      const processQueue = async () => {
        if (queueProcessing || !isFirebaseReady || progressQueue.length === 0) return;
        queueProcessing = true;
        const item = progressQueue[0];
        try {
          await saveWordProgress(item.wordId, item.status);
          progressQueue.shift();
        } catch (e) {
          item.attempts++;
          if (item.attempts > 5) {
            progressQueue.shift();
            logErr("Write drop", e);
          } else {
            const wait = Math.min(2000, 100 * Math.pow(2, item.attempts));
            await new Promise((r) => setTimeout(r, wait));
          }
        } finally {
          queueProcessing = false;
          setTimeout(processQueue, 50);
        }
      };

      const resetDatabase = async () => {
        if (!database || !isFirebaseReady) return;
        try {
          lessonListeners.forEach(({ ref, listener }) => ref.off("value", listener));
          lessonListeners.clear();
          await database.ref(`apps/${appId}`).remove();
          wordProgressCache.clear();
          lessonDataCache.clear();
          firstUnreadWordId = 1;
          showMessageModal("All progress cleared!", 1200);
        } catch (e) {
          logErr("Reset error", e);
          showMessageModal("Failed to reset. Try again.");
        } finally {
          updateLessonTiles();
        }
      };

      const clearAllData = async () => {
        await resetDatabase();
        wordDetailsModal.classList.add("hidden");
        confirmModal.classList.add("hidden");
        updateScrollLock();
      };

      const animateCounterSmooth = (duration) => {
        const start = performance.now();
        const totalWords = allWords ? allWords.length : 0;
        
        // Reset counter to 0 for smooth animation
        preloaderCount.textContent = '0';
        
        const animate = (time) => {
          const progress = time - start;
          const percentage = Math.min(progress / duration, 1);
          const currentCount = Math.floor(percentage * totalWords);
          
          preloaderCount.textContent = currentCount;
          
          if (percentage < 1) {
            requestAnimationFrame(animate);
          } else {
            preloaderCount.textContent = totalWords;
            // Hide loading screen after animation completes
            setTimeout(() => {
              hideLoadingScreen();
            }, 300);
          }
        };
        
        requestAnimationFrame(animate);
      };

      const initSpiralPreloader = () => {
        const N = 200, SIZE = 160, DOT_RADIUS = 1.5, MARGIN = 2, DURATION = 3;
        const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
        const CENTER = SIZE / 2;
        const MAX_RADIUS = CENTER - MARGIN - DOT_RADIUS;
        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("width", SIZE);
        svg.setAttribute("height", SIZE);
        svg.setAttribute("viewBox", `0 0 ${SIZE} ${SIZE}`);
        document.getElementById("spiral").appendChild(svg);
        for (let i = 0; i < N; i++) {
          const idx = i + 0.5, frac = idx / N;
          const r = Math.sqrt(frac) * MAX_RADIUS;
          const theta = idx * GOLDEN_ANGLE;
          const x = CENTER + r * Math.cos(theta);
          const y = CENTER + r * Math.sin(theta);
          const c = document.createElementNS(svgNS, "circle");
          c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", DOT_RADIUS);
          svg.appendChild(c);
          const animR = document.createElementNS(svgNS, "animate");
          animR.setAttribute("attributeName", "r");
          animR.setAttribute("values", `${DOT_RADIUS * 0.5};${DOT_RADIUS * 1.5};${DOT_RADIUS * 0.5}`);
          animR.setAttribute("dur", `${DURATION}s`);
          animR.setAttribute("begin", `${frac * DURATION}s`);
          animR.setAttribute("repeatCount", "indefinite");
          animR.setAttribute("calcMode", "spline");
          animR.setAttribute("keySplines", "0.4 0 0.6 1;0.4 0 0.6 1");
          c.appendChild(animR);
          const animO = document.createElementNS(svgNS, "animate");
          animO.setAttribute("attributeName", "opacity");
          animO.setAttribute("values", "0.3;1;0.3");
          animO.setAttribute("dur", `${DURATION}s`);
          animO.setAttribute("begin", `${frac * DURATION}s`);
          animO.setAttribute("repeatCount", "indefinite");
          animO.setAttribute("calcMode", "spline");
          animO.setAttribute("keySplines", "0.4 0 0.6 1;0.4 0 0.6 1");
          c.appendChild(animO);
        }
      };

      const fetchData = async () => {
        const success = await loadDatabasesWithProgress();
        if (!success) {
          setStatus("Using sample data");
          showMessageModal("Failed to load database files. Using sample set.", 1200);
          
          allWords = Array.from({length: 500}, (_, i) => ({
            id: i + 1,
            word: `word${i + 1}`,
            frequency: 1000 - i,
            definition: `Definition for word ${i + 1}`,
            bangla: [`বাংলা${i + 1}`],
            example: `This is an example for word${i + 1}.`,
            booklines: [
              "No booklines available for this word.",
              "Please check the booklines data file.",
              "Default placeholder text."
            ]
          }));
        }
        
        initSpiralPreloader();
        await initializeFirebase();
        if (isFirebaseReady) await loadAllProgressData();
        updateLessonTiles();
      };

      let searchTimeout = null;
      const performSearch = (query) => {
        if (!query.trim()) {
          searchResults.classList.add("hidden");
          searchClear.classList.add("hidden");
          return;
        }
        
        if (!allWords || !Array.isArray(allWords)) {
          searchResults.innerHTML = `<div class="search-no-results">Data not loaded yet. Please wait...</div>`;
          searchResults.classList.remove("hidden");
          return;
        }
        
        searchClear.classList.remove("hidden");
        const results = allWords
          .filter((w) => {
            if (!w || !w.word || typeof w.word !== 'string') return false;
            const searchQuery = query.toLowerCase();
            return w.word.toLowerCase().includes(searchQuery);
          })
          .slice(0, 10);
        displaySearchResults(results, query);
      };

      const highlightMatch = (text, query) => {
        if (!query.trim()) return text;
        const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
        return text.replace(regex, '<mark style="background: rgba(255, 193, 7, 0.3); color: var(--accent-yellow); padding: 1px 2px; border-radius: 2px;">$1</mark>');
      };

      const displaySearchResults = (results, query) => {
        if (results.length === 0) {
          searchResults.innerHTML = `<div class="search-no-results">No words found for "${query}"</div>`;
        } else {
          searchResults.innerHTML = results.map((w) => {
            const status = getWordStatus(w.id);
            const text = status === "r" ? "Read" : status === "n" ? "New" : "Unread";
            const cls = status === "r" ? "read" : status === "n" ? "new" : "unread";
            return `
              <div class="search-result-item" data-word-id="${w.id}">
                <span class="search-word-id">#${w.id}</span>
                <span class="search-word-name">${highlightMatch(w.word, query)}</span>
                <span class="search-word-status ${cls}">${text}</span>
              </div>
            `;
          }).join("");
        }
        searchResults.classList.remove("hidden");
      };

      const jumpToWord = (wordId) => {
        const targetLesson = Math.ceil(wordId / WORDS_PER_LESSON);
        const lessonWords = getLessonWords(targetLesson);
        const idx = lessonWords.findIndex((w) => w.id === wordId);
        if (idx !== -1) {
          openWordModal(targetLesson, idx);
          globalSearch.value = "";
          searchResults.classList.add("hidden");
          searchClear.classList.add("hidden");
        }
      };

      const showSlideInput = () => {
        const slideInput = document.createElement('input');
        slideInput.type = 'number';
        slideInput.className = 'slide-input';
        slideInput.placeholder = '';
        slideInput.min = '1';
        slideInput.max = allWords.length.toString();
        slideInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const wordNumber = parseInt(slideInput.value);
            if (wordNumber >= 1 && wordNumber <= allWords.length) {
              jumpToWord(wordNumber);
              slideInput.remove();
            } else {
              showMessageModal(`Please enter a number between 1 and ${allWords.length}`, 2000);
            }
          } else if (e.key === 'Escape') {
            slideInput.remove();
          }
        });
        slideInput.addEventListener('blur', () => {
          setTimeout(() => slideInput.remove(), 100);
        });
        document.body.appendChild(slideInput);
        slideInput.focus();
      };

      globalSearch.addEventListener("input", (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => performSearch(e.target.value), 200);
      });

      globalSearch.addEventListener("blur", () => {
        setTimeout(() => searchResults.classList.add("hidden"), 200);
      });

      searchClear.addEventListener("click", () => {
        globalSearch.value = "";
        searchResults.classList.add("hidden");
        searchClear.classList.add("hidden");
        globalSearch.focus();
      });

      searchResults.addEventListener("click", (e) => {
        const resultItem = e.target.closest(".search-result-item");
        if (resultItem) jumpToWord(Number.parseInt(resultItem.dataset.wordId));
      });

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "k") {
          e.preventDefault();
          globalSearch.focus();
          globalSearch.select();
        }
        if (e.key === "Escape") {
          wordDetailsModal.classList.add("hidden");
          messageModal.classList.add("hidden");
          confirmModal.classList.add("hidden");
          updateScrollLock();
        }
        if (!wordDetailsModal.classList.contains("hidden")) {
          if (["ArrowLeft", "ArrowRight", "n", "N", " ", "Enter", "b", "B"].includes(e.key)) e.preventDefault();
          if (e.key === "ArrowLeft") prevWord();
          else if (e.key === "ArrowRight") nextWord();
          else if (e.key === "n" || e.key === "N" || e.key === " ") {
            if (getWordStatus(currentLessonWords[currentWordIndex].id) !== "n") markAsNew();
          } else if (e.key === "Enter") {
            if (getWordStatus(currentLessonWords[currentWordIndex].id) === "n") markAsRead();
            else nextWord();
          } else if (e.key === "b" || e.key === "B") {
            toggleBooklines();
          }
        }
      });

      const getLessonWords = (lessonNumber) => {
        const start = (lessonNumber - 1) * WORDS_PER_LESSON;
        const end = Math.min(start + WORDS_PER_LESSON, allWords.length);
        const lessonWords = allWords.slice(start, end);
        const newWords = lessonWords.filter((w) => getWordStatus(w.id) === "n");
        const otherWords = lessonWords.filter((w) => getWordStatus(w.id) !== "n");
        return [...newWords, ...otherWords];
      };

      const getLessonProgress = (lessonNumber) => {
        const start = (lessonNumber - 1) * WORDS_PER_LESSON;
        const end = Math.min(start + WORDS_PER_LESSON, allWords.length);
        const lessonWords = allWords.slice(start, end);
        const readInLesson = lessonWords.filter((w) => getWordStatus(w.id) === "r").length;
        const newInLesson = lessonWords.filter((w) => getWordStatus(w.id) === "n").length;
        const totalWords = lessonWords.length;
        
        const readPercentage = totalWords > 0 ? Math.max(0, (readInLesson / totalWords) * 100) : 0;
        const newPercentage = totalWords > 0 ? Math.max(0, (newInLesson / totalWords) * 100) : 0;
        
        return {
          readPercentage: Math.min(100, readPercentage),
          newPercentage: Math.min(100, newPercentage),
          newCount: newInLesson,
          readCount: readInLesson,
          totalWords: totalWords
        };
      };

      const updatePagination = () => {
        const totalLessons = Math.ceil(allWords.length / WORDS_PER_LESSON);
        const totalPages = Math.ceil(totalLessons / LESSONS_PER_PAGE);
        
        [pageInfo, pageInfoBottom].forEach(el => {
          el.textContent = `Page ${currentPage} of ${totalPages}`;
        });
        
        [prevPageBtn, prevPageBtnBottom].forEach(btn => {
          btn.disabled = currentPage === 1;
        });
        
        [nextPageBtn, nextPageBtnBottom].forEach(btn => {
          btn.disabled = currentPage === totalPages;
        });
      };

      const updateLessonTiles = () => {
        const totalLessons = Math.ceil(allWords.length / WORDS_PER_LESSON);
        
        updatePagination();
        
        lessonContainer.innerHTML = "";
        
        updateContinueSystem();
        if (firstUnreadWordId && currentPage === 1) {
          const continueTile = document.createElement("div");
          continueTile.className = "lesson-tile continue";
          const targetLesson = Math.ceil(firstUnreadWordId / WORDS_PER_LESSON);
          continueTile.innerHTML = `
            <i class="fas fa-play"></i>
            <h2>Continue Learning</h2>
            <p>Resume from Word ${firstUnreadWordId}</p>
          `;
          continueTile.addEventListener("click", () => {
            const targetWordIndex = (firstUnreadWordId - 1) % WORDS_PER_LESSON;
            openWordModal(targetLesson, targetWordIndex);
          });
          lessonContainer.appendChild(continueTile);
        }

        const startLesson = (currentPage - 1) * LESSONS_PER_PAGE + 1;
        const endLesson = Math.min(startLesson + LESSONS_PER_PAGE - 1, totalLessons);

        for (let i = startLesson; i <= endLesson; i++) {
          const progressData = getLessonProgress(i);
          const lessonTile = document.createElement("div");
          lessonTile.className = "lesson-tile";
          lessonTile.dataset.lesson = i;

          const readW = Math.max(0, Math.min(100, progressData.readPercentage));
          const newW = Math.max(0, Math.min(100, progressData.newPercentage));

          const rangeStart = (i - 1) * WORDS_PER_LESSON + 1;
          const rangeEnd = Math.min(i * WORDS_PER_LESSON, allWords.length);

          lessonTile.innerHTML = `
            <h2><i class="fas fa-graduation-cap"></i> Lesson ${i}</h2>
            <p>Words ${rangeStart} - ${rangeEnd}</p>
            <div class="progress-bar">
              <div class="progress-fill-green" style="width: ${readW}%"></div>
              <div class="progress-fill-yellow" style="width: ${newW}%; left: ${readW}%"></div>
              <div class="progress-percentage">${Math.round(readW)}%</div>
            </div>
            <div class="progress-text">
              <i class="fas fa-check-circle"></i> ${progressData.readCount} read • 
              <i class="fas fa-star"></i> ${progressData.newCount} new
            </div>
          `;
          lessonTile.addEventListener("click", () => openWordModal(i, 0));
          lessonContainer.appendChild(lessonTile);
        }
      };

      const changePage = (direction) => {
        const totalLessons = Math.ceil(allWords.length / WORDS_PER_LESSON);
        const totalPages = Math.ceil(totalLessons / LESSONS_PER_PAGE);
        
        if (direction === 'prev' && currentPage > 1) {
          currentPage--;
          updateLessonTiles();
        } else if (direction === 'next' && currentPage < totalPages) {
          currentPage++;
          updateLessonTiles();
        }
      };

      prevPageBtn.addEventListener("click", () => changePage('prev'));
      nextPageBtn.addEventListener("click", () => changePage('next'));
      prevPageBtnBottom.addEventListener("click", () => changePage('prev'));
      nextPageBtnBottom.addEventListener("click", () => changePage('next'));

      const openWordModal = (lessonNum, wordIndex) => {
        currentLesson = lessonNum;
        currentWordIndex = wordIndex;
        currentLessonWords = getLessonWords(lessonNum);
        wordDetailsModal.classList.remove("hidden");
        updateScrollLock();
        updateBooklinesToggle();
        updateModalContent();
        closeModalBtn.focus();
      };

      const returnToHome = () => {
        wordDetailsModal.classList.add("hidden");
        updateScrollLock();
      };

      const updateModalContent = () => {
        const currentWord = currentLessonWords[currentWordIndex];
        if (!currentWord) {
          returnToHome();
          return;
        }
        modalWord.textContent = currentWord.word;
        modalBangla.textContent = currentWord.bangla.join(", ");
        modalDefinition.textContent = currentWord.definition || "";
        const highlightedExample = (currentWord.example || "").replace(
          new RegExp(`\\b(${currentWord.word})\\b`, "gi"),
          `<span class="highlight">$1</span>`
        );
        modalExample.innerHTML = highlightedExample;
        
        if (showBooklines) {
          modalBooklines.classList.remove('hidden');
          if (currentWord.booklines && currentWord.booklines.length > 0) {
            modalBooklines.innerHTML = currentWord.booklines.map((line, index) => 
              `<div class="bookline-item">
                <div class="bookline-number">${index + 1}</div>
                <div class="bookline-text">${highlightWordInBooklines(line, currentWord.word)}</div>
              </div>`
            ).join('');
          } else {
            modalBooklines.innerHTML = `
              <div class="bookline-item">
                <div class="bookline-number">1</div>
                <div class="bookline-text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</div>
              </div>
              <div class="bookline-item">
                <div class="bookline-number">2</div>
                <div class="bookline-text">Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.</div>
              </div>
              <div class="bookline-item">
                <div class="bookline-number">3</div>
                <div class="bookline-text">Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt.</div>
              </div>
            `;
          }
        } else {
          modalBooklines.classList.add('hidden');
        }
        
        updateFooter();
      };

      const updateFooter = () => {
        const currentWord = currentLessonWords[currentWordIndex];
        const lessonStartIndex = (currentLesson - 1) * WORDS_PER_LESSON;
        const originalPosition = currentWord.id - lessonStartIndex;
        const lessonEndId = Math.min(currentLesson * WORDS_PER_LESSON, allWords.length);
        const lessonStartId = lessonStartIndex + 1;

        wordCounter.textContent = `${originalPosition}/${lessonEndId - lessonStartId + 1}`;
        frequencyDisplay.textContent = isFrequencyMode ? currentWord.frequency : currentWord.id;

        if (getWordStatus(currentWord.id) === "n") {
          newBtn.classList.add("hidden");
          readBtn.classList.remove("hidden");
          nextWordBtn.classList.add("hidden");
        } else {
          newBtn.classList.remove("hidden");
          readBtn.classList.add("hidden");
          nextWordBtn.classList.remove("hidden");
        }
      };

      const markAsNew = async () => {
        const currentWord = currentLessonWords[currentWordIndex];
        setWordStatus(currentWord.id, "n");
        enqueueProgress(currentWord.id, "n");
        currentLessonWords = getLessonWords(currentLesson);
        currentWordIndex = currentLessonWords.findIndex((w) => w.id === currentWord.id);
        updateContinueSystem();
        updateModalContent();
        updateLessonTiles();
      };

      const markAsRead = async () => {
        const currentWord = currentLessonWords[currentWordIndex];
        setWordStatus(currentWord.id, "r");
        enqueueProgress(currentWord.id, "r");
        currentLessonWords = getLessonWords(currentLesson);
        updateContinueSystem();
        updateModalContent();
        updateLessonTiles();
        nextWord();
      };

      const prevWord = async () => {
        if (currentWordIndex > 0) {
          const currentWord = currentLessonWords[currentWordIndex];
          if (getWordStatus(currentWord.id) === "ur") {
            setWordStatus(currentWord.id, "r");
            enqueueProgress(currentWord.id, "r");
            updateContinueSystem();
            updateLessonTiles();
          }
          currentWordIndex--;
          updateModalContent();
        }
      };

      const nextWord = async () => {
        const currentWord = currentLessonWords[currentWordIndex];

        if (getWordStatus(currentWord.id) === "ur") {
          setWordStatus(currentWord.id, "r");
          enqueueProgress(currentWord.id, "r");
          updateContinueSystem();
          updateLessonTiles();
        }

        if (currentWordIndex < currentLessonWords.length - 1) {
          currentWordIndex++;
          updateModalContent();
        }
      };

      closeModalBtn.addEventListener("click", returnToHome);
      
      booklinesToggleBtn.addEventListener("click", toggleBooklines);
      
      wordCounter.addEventListener("click", showSlideInput);

      clearAllDataBtn.addEventListener("click", () => {
        confirmModal.classList.remove("hidden");
        updateScrollLock();
      });

      confirmYesBtn.addEventListener("click", clearAllData);
      confirmNoBtn.addEventListener("click", () => {
        confirmModal.classList.add("hidden");
        updateScrollLock();
      });

      newBtn.addEventListener("click", markAsNew);
      readBtn.addEventListener("click", markAsRead);
      nextWordBtn.addEventListener("click", nextWord);

      frequencyDisplay.addEventListener("click", () => {
        isFrequencyMode = !isFrequencyMode;
        updateFooter();
      });

      const blockScroll = (e) => e.preventDefault();
      [wordDetailsModal, messageModal, confirmModal].forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target === el) {
            el.classList.add("hidden");
            updateScrollLock();
          }
        });
      });

      wordDetailsModal.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        isSwiping = true;
      });

      wordDetailsModal.addEventListener("touchend", (e) => {
        if (!isSwiping) return;
        isSwiping = false;
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const deltaX = endX - startX;
        const deltaY = endY - startY;
        const minSwipeDistance = 50;
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipeDistance) {
          if (deltaX > 0) prevWord();
          else nextWord();
        }
      });

      messageOkBtn.addEventListener("click", () => {
        messageModal.classList.add("hidden");
        updateScrollLock();
      });

      window.addEventListener("beforeunload", () => {
        lessonListeners.forEach(({ ref, listener }) => ref.off("value", listener));
        lessonListeners.clear();
      });

      fetchData();
    });
  </script>
</head>
<body>
  <div id="preloader">
    <div id="p-c"><i class="fas fa-book"></i> Dictionary</div>
    <div id="preloader-status" class="preloader-status">Starting…</div>
    <div id="preloader-count">0</div>
    <div id="spiral"></div>
  </div>

  <div id="app-container" class="hidden">
    <header>
      <h1><i class="fas fa-book-open"></i> Dictionary</h1>
      <div class="search-container">
        <div class="search-wrapper">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="global-search" class="search-input" placeholder="Search words..." autocomplete="off">
          <button id="search-clear" class="search-clear hidden"><i class="fas fa-times"></i></button>
        </div>
        <div id="search-results" class="search-results hidden"></div>
      </div>
    </header>

    <div id="pagination-container" class="pagination-container">
      <button id="prev-page" class="pagination-btn"><i class="fas fa-chevron-left"></i></button>
      <span id="page-info" class="page-info">Page 1 of 1</span>
      <button id="next-page" class="pagination-btn"><i class="fas fa-chevron-right"></i></button>
    </div>

    <main id="lesson-container"></main>

    <div id="pagination-container-bottom" class="pagination-container">
      <button id="prev-page-bottom" class="pagination-btn"><i class="fas fa-chevron-left"></i></button>
      <span id="page-info-bottom" class="page-info">Page 1 of 1</span>
      <button id="next-page-bottom" class="pagination-btn"><i class="fas fa-chevron-right"></i></button>
    </div>

    <footer>
      <button id="clear-all-data-btn" class="clear-data-btn">
        <i class="fas fa-trash-alt"></i> Clear All Data
      </button>
    </footer>
  </div>

  <div id="word-details-modal" class="hidden modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <div id="frequency-display" class="frequency-display"></div>
        <div class="header-controls">
          <button id="booklines-toggle" class="booklines-toggle active">
            <i class="fas fa-eye"></i>
            <span class="toggle-text">Hide Context</span>
          </button>
          <span id="close-modal" class="close-btn"><i class="fas fa-times"></i></span>
        </div>
      </div>
      <div class="modal-body">
        <div class="word-section">
          <div id="modal-word"></div>
          <div id="modal-bangla"></div>
        </div>
        <div class="content-section">
          <div id="modal-definition"></div>
          <div id="modal-example"></div>
          <div id="modal-booklines" class="modal-booklines"></div>
        </div>
      </div>
      <div class="modal-footer">
        <div id="word-counter" class="word-counter">
          <i class="fas fa-list-ol"></i> <span></span>
        </div>
        <div class="progress-buttons">
          <button id="new-btn" class="progress-btn new-btn"><i class="fas fa-star"></i></button>
          <button id="read-btn" class="progress-btn read-btn hidden"><i class="fas fa-check"></i></button>
          <button id="next-word-btn" class="progress-btn next-word-btn"><i class="fas fa-arrow-right"></i></button>
        </div>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="hidden modal-overlay">
    <div class="confirm-modal-content">
      <h3><i class="fas fa-exclamation-triangle"></i> Clear all progress?</h3>
      <div class="confirm-buttons">
        <button id="confirm-yes-btn" class="yes-btn">Yes</button>
        <button id="confirm-no-btn" class="no-btn">No</button>
      </div>
    </div>
  </div>

  <div id="message-modal" class="hidden modal-overlay">
    <div class="message-content">
      <p id="message-text"></p>
      <button id="message-ok-btn">OK</button>
    </div>
  </div>
</body>
</html>
